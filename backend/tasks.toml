[lint-go]
description = "Lint Go packages with golangci-lint"
hide = true
dir = "backend"
run = "golangci-lint run ./..."

[lint-architecture]
description = "Check Go package dependency rules"
hide = true
dir = "backend"
run = "go tool go-arch-lint check --project-path ."

[d1-local-migrate]
description = "Apply local D1 migrations"
hide = true
dir = "backend"
run = "wrangler d1 migrations apply go-tickets --config ../wrangler.public.jsonc --local --persist-to ${E2E_D1_PERSIST:-../.wrangler/state}"

[d1-local-init]
description = "Insert the local test event after migrations"
hide = true
dir = "backend"
depends = ["d1-local-migrate"]
run = "wrangler d1 execute go-tickets --config ../wrangler.public.jsonc --local --persist-to ${E2E_D1_PERSIST:-../.wrangler/state} --file scripts/seed-local.sql"

[wrangler-dev-admin]
description = "Run the Admin Worker locally"
hide = true
dir = "backend"
run = "wrangler dev --config ../wrangler.admin.jsonc --local --port 8788 --inspector-port 9230 --persist-to ${E2E_D1_PERSIST:-../.wrangler/state}"

[wrangler-dev-public]
description = "Run the Public Worker locally"
hide = true
dir = "backend"
run = "wrangler dev --config ../wrangler.public.jsonc --local --port 8787 --persist-to ${E2E_D1_PERSIST:-../.wrangler/state}"
