[lint-go]
description = "Lint Go packages with golangci-lint"
hide = true
dir = "backend"
run = "golangci-lint run ./..."

[d1-local-init]
description = "Apply local D1 migrations and insert the test event"
hide = true
dir = "backend"
run = [
  "wrangler d1 migrations apply go-tickets --config ../wrangler.public.jsonc --local --persist-to ${E2E_D1_PERSIST:-../.wrangler/state}",
  "wrangler d1 execute go-tickets --config ../wrangler.public.jsonc --local --persist-to ${E2E_D1_PERSIST:-../.wrangler/state} --file scripts/seed-local.sql",
]

[wrangler-dev-admin]
description = "Run the Admin Worker locally"
hide = true
dir = "backend"
run = "wrangler dev --config ../wrangler.admin.jsonc --local --port 8788 --inspector-port 9230 --persist-to ${E2E_D1_PERSIST:-../.wrangler/state}"

[wrangler-dev-public]
description = "Run the Public Worker locally"
hide = true
dir = "backend"
run = "wrangler dev --config ../wrangler.public.jsonc --local --port 8787 --persist-to ${E2E_D1_PERSIST:-../.wrangler/state}"
