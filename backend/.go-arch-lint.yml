version: 3
workdir: .

allow:
  depOnAnyVendor: true
  ignoreNotFoundComponents: false

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*internal/test/.*$"

components:
  auth:
    in: internal/auth
  event:
    in: internal/event
  ticket:
    in: internal/ticket
  profile:
    in: internal/profile
  http:
    in: x/http
  testx:
    in: x/testx
  public:
    in: cmd/public
  admin:
    in: cmd/admin

deps:
  http:
    anyVendorDeps: true

  auth:
    mayDependOn:
      - http

  ticket:
    mayDependOn:
      - http

  profile:
    mayDependOn:
      - http

  event:
    mayDependOn:
      - ticket
      - http

  public:
    mayDependOn:
      - auth
      - event
      - ticket
      - profile
      - http

  admin:
    mayDependOn:
      - auth
      - event
      - ticket
      - http
