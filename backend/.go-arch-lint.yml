version: 3
workdir: .

allow:
  depOnAnyVendor: true
  ignoreNotFoundComponents: false

excludeFiles:
  - "^.*_test\\.go$"
  - "^.*internal/test/.*$"
  - "^.*tool/lint/.*/testdata/.*$"

components:
  auth:
    in: internal/auth
  event:
    in: internal/event
  ticket:
    in: internal/ticket
  profile:
    in: internal/profile
  http:
    in: x/http
  test:
    in: x/test
  public:
    in: cmd/public
  admin:
    in: cmd/admin
  lint-cli:
    in: tool/lint
  lint-tabledriven:
    in: tool/lint/analyzers/tabledriven
  lint-tabledrivencomplexity:
    in: tool/lint/analyzers/tabledrivencomplexity

deps:
  http:
    anyVendorDeps: true

  auth:
    mayDependOn:
      - http

  ticket:
    mayDependOn:
      - http

  profile:
    mayDependOn:
      - http

  event:
    mayDependOn:
      - ticket
      - http

  public:
    mayDependOn:
      - auth
      - event
      - ticket
      - profile
      - http

  admin:
    mayDependOn:
      - auth
      - event
      - ticket
      - http

  lint-cli:
    mayDependOn:
      - lint-tabledriven
      - lint-tabledrivencomplexity
