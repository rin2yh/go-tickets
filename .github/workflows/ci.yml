name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  frontend-lint:
    name: Lint frontend ${{ matrix.app }}
    runs-on: &ubuntu ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        app: [public, admin, ui, e2e]
    permissions:
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - &setup-pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.1
      - &install-frontend
        id: frontend_dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Lint ${{ matrix.app }}
        run: pnpm --filter @go-tickets/${{ matrix.app }} lint
        working-directory: frontend

  frontend-test:
    name: Test frontend ${{ matrix.app }}
    runs-on: *ubuntu
    strategy:
      fail-fast: false
      matrix:
        app: [public, admin, ui]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - *checkout
      - *setup-node
      - *setup-pnpm
      - *install-frontend
      - name: Run tests
        run: pnpm --filter @go-tickets/${{ matrix.app }} test
        working-directory: frontend
      - name: Report coverage
        if: always() && steps.frontend_dependencies.outcome == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: step-security/vitest-coverage-report-action@e89c203f0a03fd8fabdb34d5d0fcdd3592ac4321 # v2
        with:
          name: ${{ matrix.app }}
          working-directory: frontend/${{ matrix.app }}
          json-summary-path: ../coverage/${{ matrix.app }}/coverage-summary.json
          json-final-path: ../coverage/${{ matrix.app }}/coverage-final.json

  backend:
    name: Lint and test Go code
    runs-on: *ubuntu
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - *checkout
      - &setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend
      - name: Check Go architecture
        run: go tool go-arch-lint check --project-path .
        working-directory: backend
      - name: Test Go test analyzers
        run: go test ./tool/lint/...
        working-directory: backend
      - name: Check table-driven Go tests
        run: go run ./tool/lint ./...
        working-directory: backend
      - name: Run tests with coverage
        run: go test ./... -coverpkg=./... -coverprofile=coverage.out
        working-directory: backend
      - name: Report coverage
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2

  audit:
    name: Audit frontend dependencies
    runs-on: *ubuntu
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-node
      - *setup-pnpm
      - *install-frontend
      - run: pnpm audit --audit-level=high
        working-directory: frontend

  worker:
    name: Build and dry-run ${{ matrix.name }} Worker
    runs-on: *ubuntu
    strategy:
      matrix:
        include:
          - name: Public
            app: public
            config: ../wrangler.public.jsonc
            outdir: ../backend/build/dry-public
          - name: Admin
            app: admin
            config: ../wrangler.admin.jsonc
            outdir: ../backend/build/dry-admin
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-node
      - *setup-pnpm
      - *install-frontend
      - name: Build ${{ matrix.name }} frontend
        working-directory: frontend
        env:
          PUBLIC_EVENTS_JSON: '[]'
        run: pnpm --filter @go-tickets/${{ matrix.app }} build
      - *setup-go
      - name: Build ${{ matrix.name }} Worker
        working-directory: backend
        env:
          WORKER_APP: ${{ matrix.app }}
        run: &build-worker |
          go tool workers-assets-gen -mode=go -o build/$WORKER_APP
          mv build/$WORKER_APP/worker.mjs build/$WORKER_APP/worker-runtime.mjs
          GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -ldflags='-s -w' -o build/$WORKER_APP/app.wasm ./cmd/$WORKER_APP
      - &setup-wrangler
        run: npm install --global wrangler@4.145.0
      - name: Dry-run Wrangler bundle
        working-directory: frontend
        run: wrangler deploy --config ${{ matrix.config }} --dry-run --outdir ${{ matrix.outdir }}

  e2e:
    name: Run E2E tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: *ubuntu
    permissions:
      contents: read
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: go-tickets-e2e+clerk_test@example.com
    steps:
      - *checkout
      - *setup-node
      - *setup-pnpm
      - *install-frontend
      - run: pnpm --filter @go-tickets/e2e exec playwright install --with-deps chromium
        working-directory: frontend
      - *setup-wrangler
      - name: Prepare isolated local D1
        run: |
          cat > .dev.vars <<EOF
          CLERK_SECRET_KEY=$CLERK_SECRET_KEY
          EOF
          wrangler d1 migrations apply go-tickets --config wrangler.public.jsonc --local --persist-to .wrangler/e2e
          wrangler d1 execute go-tickets --config wrangler.public.jsonc --local --persist-to .wrangler/e2e --file backend/scripts/seed-local.sql
      - name: Build Public frontend assets
        working-directory: frontend
        run: PUBLIC_EVENTS_JSON="$(cat e2e/fixtures/public-events.json)" pnpm --filter @go-tickets/public build
      - *setup-go
      - name: Build Public Worker
        working-directory: backend
        env:
          WORKER_APP: public
        run: *build-worker
      - name: Run E2E tests
        working-directory: frontend
        run: pnpm --filter @go-tickets/e2e test
