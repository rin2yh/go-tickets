name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run lint, tests, and dependency audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v5.0.0
        with:
          version: 2026.6.0
      - run: mise exec -- pnpm --dir frontend install --frozen-lockfile
      - run: mise exec -- pnpm --dir frontend audit --audit-level=high
      - run: mise run lint-go
      - run: mise run test

  worker:
    name: Build and dry-run ${{ matrix.name }} Worker
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: Public
            task: dry-public
          - name: Admin
            task: dry-admin
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v5.0.0
        with:
          version: 2026.6.0
      - run: mise exec -- pnpm --dir frontend install --frozen-lockfile
      - run: mise run "${{ matrix.task }}"
