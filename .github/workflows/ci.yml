name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint Go and frontend code
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.6.0
      - run: mise run lint-go
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run lint
        working-directory: frontend
      - run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm run format:check
        working-directory: frontend

  test:
    name: Run tests
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.6.0
      - run: mise run test

  audit:
    name: Audit frontend dependencies
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.6.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm audit --audit-level=high
        working-directory: frontend

  worker:
    name: Build and dry-run ${{ matrix.name }} Worker
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - name: Public
            task: dry-public
          - name: Admin
            task: dry-admin
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: 2026.6.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: mise run "${{ matrix.task }}"
