name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint Go and frontend code
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend
      - uses: actions/setup-node@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          node-version: 26.7.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.1
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run lint
        working-directory: frontend
      - run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm run format:check
        working-directory: frontend

  test:
    name: Run tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          node-version: 26.7.0
      - run: go test ./...
        working-directory: backend
      - run: node --test cmd/public/worker.test.mjs
        working-directory: backend

  audit:
    name: Audit frontend dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          node-version: 26.7.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.1
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm audit --audit-level=high
        working-directory: frontend

  worker:
    name: Build and dry-run ${{ matrix.name }} Worker
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: Public
            config: ../wrangler.public.jsonc
            outdir: ../backend/build/dry-public
          - name: Admin
            config: ../wrangler.admin.jsonc
            outdir: ../backend/build/dry-admin
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          node-version: 26.7.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.1
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Reset isolated local D1
        if: matrix.name == 'Public'
        run: rm -rf .wrangler/ci
      - name: Prepare isolated local D1
        if: matrix.name == 'Public'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: frontend
          packageManager: pnpm
          wranglerVersion: "4.145.0"
          command: |
            d1 migrations apply go-tickets --config ../wrangler.public.jsonc --local --persist-to ../.wrangler/ci
            d1 execute go-tickets --config ../wrangler.public.jsonc --local --persist-to ../.wrangler/ci --file ../backend/scripts/seed-local.sql
      - name: Build Public runtime
        if: matrix.name == 'Public'
        working-directory: backend
        run: |
          go tool workers-assets-gen -mode=go -o build/public
          mv build/public/worker.mjs build/public/worker-runtime.mjs
          GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -ldflags='-s -w' -o build/public/app.wasm ./cmd/public
      - name: Read local D1 for Public SSG
        if: matrix.name == 'Public'
        id: public-data
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: frontend
          packageManager: pnpm
          wranglerVersion: "4.145.0"
          command: d1 execute go-tickets --config ../wrangler.public.jsonc --local --persist-to ../.wrangler/ci --command "SELECT e.id AS id, e.name AS name, t.id AS ticket_type_id, t.name AS ticket_type_name FROM events e LEFT JOIN ticket_types t ON t.event_id = e.id ORDER BY e.id, t.id" --json
      - name: Build Public assets
        if: matrix.name == 'Public'
        working-directory: frontend
        env:
          PUBLIC_EVENTS_JSON: ${{ steps.public-data.outputs.command-output }}
        run: |
          pnpm run build:public
      - name: Build Admin SPA
        if: matrix.name == 'Admin'
        working-directory: frontend
        run: pnpm run build:admin
      - name: Build Admin runtime
        if: matrix.name == 'Admin'
        working-directory: backend
        run: |
          go tool workers-assets-gen -mode=go -o build/admin
          mv build/admin/worker.mjs build/admin/worker-runtime.mjs
          GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -ldflags='-s -w' -o build/admin/app.wasm ./cmd/admin
      - name: Place Public assets for Wrangler
        if: matrix.name == 'Public'
        working-directory: backend/build
        run: |
          mkdir -p web
          cp -R public-assets/. web/
      - name: Dry-run Wrangler bundle
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          workingDirectory: frontend
          packageManager: pnpm
          wranglerVersion: "4.145.0"
          command: deploy --config ${{ matrix.config }} --dry-run --outdir ${{ matrix.outdir }}
