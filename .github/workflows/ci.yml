name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint Go and frontend code
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.1
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run lint
        working-directory: frontend
      - run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm run format:check
        working-directory: frontend

  test:
    name: Run tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - run: go test ./...
        working-directory: backend
      - run: node --test cmd/public/worker.test.mjs
        working-directory: backend

  audit:
    name: Audit frontend dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.1
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm audit --audit-level=high
        working-directory: frontend

  worker:
    name: Build and dry-run ${{ matrix.name }} Worker
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: Public
            app: public
            config: ../wrangler.public.jsonc
            outdir: ../backend/build/dry-public
          - name: Admin
            app: admin
            config: ../wrangler.admin.jsonc
            outdir: ../backend/build/dry-admin
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          node-version: 26.7.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.1
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: npm install --global wrangler@4.145.0
      - name: Build ${{ matrix.name }} frontend
        working-directory: frontend
        env:
          PUBLIC_EVENTS_JSON: '[]'
        run: pnpm --filter @go-tickets/${{ matrix.app }} build
      - name: Build ${{ matrix.name }} Worker
        working-directory: backend
        run: |
          go tool workers-assets-gen -mode=go -o build/${{ matrix.app }}
          mv build/${{ matrix.app }}/worker.mjs build/${{ matrix.app }}/worker-runtime.mjs
          GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -ldflags='-s -w' -o build/${{ matrix.app }}/app.wasm ./cmd/${{ matrix.app }}
      - name: Dry-run Wrangler bundle
        working-directory: frontend
        run: wrangler deploy --config ${{ matrix.config }} --dry-run --outdir ${{ matrix.outdir }}
