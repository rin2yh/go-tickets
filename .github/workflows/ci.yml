name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint Go and frontend code
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend
      - &setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - &setup-pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.1
      - &install-frontend
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run lint
        working-directory: frontend
      - run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm run format:check
        working-directory: frontend

  test:
    name: Run tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-go
      - *setup-node
      - run: go test ./...
        working-directory: backend
      - run: node --test cmd/public/worker.test.mjs
        working-directory: backend

  audit:
    name: Audit frontend dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-node
      - *setup-pnpm
      - *install-frontend
      - run: pnpm audit --audit-level=high
        working-directory: frontend

  worker:
    name: Build and dry-run ${{ matrix.name }} Worker
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: Public
            app: public
            config: ../wrangler.public.jsonc
            outdir: ../backend/build/dry-public
          - name: Admin
            app: admin
            config: ../wrangler.admin.jsonc
            outdir: ../backend/build/dry-admin
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-go
      - *setup-node
      - *setup-pnpm
      - *install-frontend
      - run: npm install --global wrangler@4.145.0
      - name: Build ${{ matrix.name }} frontend
        working-directory: frontend
        env:
          PUBLIC_EVENTS_JSON: '[]'
        run: pnpm --filter @go-tickets/${{ matrix.app }} build
      - name: Build ${{ matrix.name }} Worker
        working-directory: backend
        run: |
          go tool workers-assets-gen -mode=go -o build/${{ matrix.app }}
          mv build/${{ matrix.app }}/worker.mjs build/${{ matrix.app }}/worker-runtime.mjs
          GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -ldflags='-s -w' -o build/${{ matrix.app }}/app.wasm ./cmd/${{ matrix.app }}
      - name: Dry-run Wrangler bundle
        working-directory: frontend
        run: wrangler deploy --config ${{ matrix.config }} --dry-run --outdir ${{ matrix.outdir }}

  e2e:
    name: Run E2E tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: go-tickets-e2e+clerk_test@example.com
    steps:
      - *checkout
      - *setup-go
      - *setup-node
      - *setup-pnpm
      - *install-frontend
      - run: npm install --global wrangler@4.145.0
      - run: pnpm --filter @go-tickets/e2e exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Prepare isolated local D1
        run: |
          printf 'CLERK_SECRET_KEY=%s\n' "$CLERK_SECRET_KEY" > .dev.vars
          rm -rf .wrangler/e2e
          wrangler d1 migrations apply go-tickets --config wrangler.public.jsonc --local --persist-to .wrangler/e2e
          wrangler d1 execute go-tickets --config wrangler.public.jsonc --local --persist-to .wrangler/e2e --file backend/scripts/seed-local.sql
      - name: Build Public and Admin Workers
        run: |
          query='SELECT e.id AS id, e.name AS name, t.id AS ticket_type_id, t.name AS ticket_type_name FROM events e LEFT JOIN ticket_types t ON t.event_id = e.id ORDER BY e.id, t.id'
          PUBLIC_EVENTS_JSON="$(wrangler d1 execute go-tickets --config wrangler.public.jsonc --local --persist-to .wrangler/e2e --command "$query" --json)" pnpm --dir frontend --filter @go-tickets/public build
          pnpm --dir frontend --filter @go-tickets/admin build
          cd backend
          go tool workers-assets-gen -mode=go -o build/public
          mv build/public/worker.mjs build/public/worker-runtime.mjs
          GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -ldflags='-s -w' -o build/public/app.wasm ./cmd/public
          go tool workers-assets-gen -mode=go -o build/admin
          mv build/admin/worker.mjs build/admin/worker-runtime.mjs
          GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -ldflags='-s -w' -o build/admin/app.wasm ./cmd/admin
      - name: Start Workers and run E2E tests
        run: |
          wrangler dev --config wrangler.admin.jsonc --local --port 8788 --inspector-port 9230 --persist-to .wrangler/e2e > "$RUNNER_TEMP/admin-worker.log" 2>&1 &
          admin_pid=$!
          wrangler dev --config wrangler.public.jsonc --local --port 8787 --persist-to .wrangler/e2e > "$RUNNER_TEMP/public-worker.log" 2>&1 &
          public_pid=$!
          trap 'kill "$public_pid" "$admin_pid" 2>/dev/null || true' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail http://localhost:8787/health
          pnpm --dir frontend --filter @go-tickets/e2e test
