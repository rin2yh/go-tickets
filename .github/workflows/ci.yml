name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint Go code
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v5.0.0
        with:
          version: 2026.6.0
      - run: mise run lint-go

  test:
    name: Run tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v5.0.0
        with:
          version: 2026.6.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: mise run test

  audit:
    name: Audit frontend dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v5.0.0
        with:
          version: 2026.6.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm audit --audit-level=high
        working-directory: frontend

  worker:
    name: Build and dry-run ${{ matrix.name }} Worker
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: Public
            task: dry-public
          - name: Admin
            task: dry-admin
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: jdx/mise-action@v5.0.0
        with:
          version: 2026.6.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: mise run "${{ matrix.task }}"
