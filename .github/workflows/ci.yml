name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint Go and frontend code
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &setup-go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: backend/go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend
      - &setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.7.0
      - &setup-pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.5.1
      - &install-frontend
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run lint
        working-directory: frontend
      - run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm run format:check
        working-directory: frontend

  test:
    name: Run tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-go
      - *setup-node
      - run: go test ./...
        working-directory: backend
      - run: node --test cmd/public/worker.test.mjs
        working-directory: backend

  audit:
    name: Audit frontend dependencies
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-node
      - *setup-pnpm
      - *install-frontend
      - run: pnpm audit --audit-level=high
        working-directory: frontend

  worker:
    name: Build and dry-run ${{ matrix.name }} Worker
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: Public
            app: public
            config: ../wrangler.public.jsonc
            outdir: ../backend/build/dry-public
          - name: Admin
            app: admin
            config: ../wrangler.admin.jsonc
            outdir: ../backend/build/dry-admin
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup-go
      - *setup-node
      - *setup-pnpm
      - *install-frontend
      - run: npm install --global wrangler@4.145.0
      - name: Build ${{ matrix.name }} frontend
        working-directory: frontend
        env:
          PUBLIC_EVENTS_JSON: '[]'
        run: pnpm --filter @go-tickets/${{ matrix.app }} build
      - name: Build ${{ matrix.name }} Worker
        working-directory: backend
        env:
          WORKER_APP: ${{ matrix.app }}
        run: &build-worker |
          go tool workers-assets-gen -mode=go -o build/$WORKER_APP
          mv build/$WORKER_APP/worker.mjs build/$WORKER_APP/worker-runtime.mjs
          GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -ldflags='-s -w' -o build/$WORKER_APP/app.wasm ./cmd/$WORKER_APP
      - name: Dry-run Wrangler bundle
        working-directory: frontend
        run: wrangler deploy --config ${{ matrix.config }} --dry-run --outdir ${{ matrix.outdir }}

  e2e:
    name: Run E2E tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: go-tickets-e2e+clerk_test@example.com
    steps:
      - *checkout
      - *setup-go
      - *setup-node
      - *setup-pnpm
      - *install-frontend
      - run: npm install --global wrangler@4.145.0
      - run: pnpm --filter @go-tickets/e2e exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Prepare isolated local D1
        run: |
          node -e 'require("node:fs").writeFileSync(".dev.vars", `CLERK_SECRET_KEY=${process.env.CLERK_SECRET_KEY}\n`, { mode: 0o600 })'
          rm -rf .wrangler/e2e
          wrangler d1 migrations apply go-tickets --config wrangler.public.jsonc --local --persist-to .wrangler/e2e
          wrangler d1 execute go-tickets --config wrangler.public.jsonc --local --persist-to .wrangler/e2e --file backend/scripts/seed-local.sql
      - name: Build Public frontend assets
        working-directory: frontend
        run: PUBLIC_EVENTS_JSON="$(cat e2e/fixtures/public-events.json)" pnpm --filter @go-tickets/public build
      - name: Build Public Worker
        working-directory: backend
        env:
          WORKER_APP: public
        run: *build-worker
      - name: Start Public Worker and run E2E tests
        working-directory: frontend
        run: |
          wrangler dev --config ../wrangler.public.jsonc --local --port 8787 --persist-to ../.wrangler/e2e > "$RUNNER_TEMP/public-worker.log" 2>&1 &
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail http://localhost:8787/health
          pnpm --filter @go-tickets/e2e test
