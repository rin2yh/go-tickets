[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
node = "26.7.0"
pnpm = "11.5.1"
"npm:wrangler" = "4.145.0"

[task_config]
includes = [
  "backend/tasks.toml",
  "frontend/tasks.toml",
]

[tasks.test]
description = "Run Go tests"
run = [{ task = "test-go" }, { task = "test-public-routing" }]

[tasks.build-public]
description = "Build Public Worker and Astro assets"
run = "mise run generate-public-runtime && mise run build-public-wasm && mise run assemble-web-assets"

[tasks.build-admin]
description = "Build Admin Worker and SPA assets"
run = "mise run generate-admin-runtime && mise run build-admin-wasm && mise run build-admin-assets"

[tasks.dev]
description = "Build and run Public and Admin Workers locally"
run = '''
mise run build-public && mise run build-admin
mise run dev-public &
public_pid=$!
mise run dev-admin &
admin_pid=$!
trap 'trap - INT TERM EXIT; kill -TERM -- -$$ 2>/dev/null || true' INT TERM EXIT
wait
'''

[tasks.e2e-prepare]
description = "Recreate the isolated local D1 used by E2E tests"
run = '''
set -eu
export E2E_D1_PERSIST="../.wrangler/e2e"
rm -rf .wrangler/e2e
mise run d1-local-init
'''

[tasks.e2e-dev]
description = "Prepare isolated E2E data and run the local Workers"
run = '''
node -e 'const net = require("node:net"); for (const port of [8787, 8788]) { const server = net.createServer(); server.once("error", () => { console.error(`E2E requires port ${port} to be free; stop the existing listener and retry.`); process.exit(1); }); server.listen(port, "127.0.0.1", () => server.close()); }'
export E2E_D1_PERSIST="../.wrangler/e2e"
mise run e2e-prepare
mise run dev &
dev_pid=$!
trap 'trap - INT TERM EXIT; kill -TERM -- -$dev_pid 2>/dev/null || true; wait "$dev_pid" 2>/dev/null || true' INT TERM EXIT
wait "$dev_pid"
'''

[tasks.test-e2e]
description = "Run Playwright E2E tests with isolated local D1"
env = { _.file = ".dev.vars" }
run = "cd frontend && pnpm --filter @go-tickets/e2e test"

[tasks.dev-admin]
description = "Run the Admin Worker locally"
run = [{ task = "wrangler-dev-admin" }]

[tasks.dev-public]
description = "Run the Public Worker locally"
run = [{ task = "wrangler-dev-public" }]

[tasks.dry-public]
description = "Build and validate the Public Worker bundle"
run = [{ task = "build-public" }, { task = "dry-public-bundle" }]

[tasks.dry-admin]
description = "Build and validate the Admin Worker bundle"
run = [{ task = "build-admin" }, { task = "dry-admin-bundle" }]

[tasks.assemble-web-assets]
description = "Combine the independently built Public and Admin frontends"
depends = ["build-public-assets", "build-admin-assets"]
run = "rm -rf backend/build/web && mkdir -p backend/build/web/admin && cp -R backend/build/public-assets/. backend/build/web/ && cp -R backend/build/admin-assets/. backend/build/web/admin/"
