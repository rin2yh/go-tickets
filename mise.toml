[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
node = "26.7.0"
pnpm = "11.5.1"
"npm:wrangler" = "4.145.0"

[task_config]
includes = [
  "backend/tasks.toml",
  "frontend/tasks.toml",
]

[tasks.test]
description = "Run Go tests"
dir = "backend"
run = "go test ./..."

[tasks.init]
description = "Install local tools, dependencies, D1, Clerk settings, and Playwright"
run = [{ task = "init-dependencies" }, { task = "d1-local-init" }, { task = "register-local-admin" }]

[tasks.e2e]
description = "Run Playwright E2E tests with isolated local D1"
env = { _.file = ".dev.vars" }
dir = "frontend"
run = "pnpm --filter @go-tickets/e2e test"

[tasks.check]
description = "Run lint, format checks, and typechecks"
run = [{ task = "lint-go" }, { task = "lint-frontend" }, { task = "format-frontend" }, { task = "typecheck-frontend" }]

[tasks.build]
description = "Build the Public and Admin Workers"
run = [{ task = "build-public" }, { task = "build-admin" }]

[tasks.dry]
description = "Build and run Wrangler dry-runs for Public and Admin"
run = [{ task = "build" }, { task = "dry-public-bundle" }, { task = "dry-admin-bundle" }]

[tasks.init-dependencies]
description = "Install pinned tools, frontend dependencies, local Clerk config, and Chromium"
hide = true
run = '''
set -eu
mise install
if [ ! -f .dev.vars ]; then
  cp .dev.vars.example .dev.vars
  printf "Created .dev.vars; set CLERK_SECRET_KEY before starting Workers.\\n"
fi
mise run install-frontend
'''

[tasks.register-local-admin]
description = "Add a Clerk user to the local D1 administrator table"
hide = true
dir = "backend"
run = '''
set -eu
CLERK_USER_ID="${CLERK_USER_ID:-}"
if [ -z "$CLERK_USER_ID" ] && [ -t 0 ]; then
  printf "Clerk user ID for local admin (leave blank to skip): "
  read -r CLERK_USER_ID || true
fi
if [ -n "$CLERK_USER_ID" ]; then
  case "$CLERK_USER_ID" in user_[A-Za-z0-9_]*) ;; *) echo "invalid Clerk user ID" >&2; exit 2;; esac
  case "$CLERK_USER_ID" in *[!A-Za-z0-9_]*) echo "invalid Clerk user ID" >&2; exit 2;; esac
  wrangler d1 execute go-tickets --config ../wrangler.admin.jsonc --local --persist-to ../.wrangler/state --command "INSERT OR IGNORE INTO administrators(clerk_user_id) VALUES ('$CLERK_USER_ID')"
fi
'''

[tasks.build-public]
description = "Build Public Worker and Astro assets"
hide = true
dir = "backend"
run = '''
go tool workers-assets-gen -mode=go -o build/public
mv build/public/worker.mjs build/public/worker-runtime.mjs
GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -ldflags='-s -w' -o build/public/app.wasm ./cmd/public
mise run build-public-assets
'''

[tasks.build-admin]
description = "Build Admin Worker and SPA assets"
hide = true
dir = "backend"
run = '''
go tool workers-assets-gen -mode=go -o build/admin
mv build/admin/worker.mjs build/admin/worker-runtime.mjs
GOOS=js GOARCH=wasm go build -trimpath -buildvcs=false -ldflags='-s -w' -o build/admin/app.wasm ./cmd/admin
mise run build-admin-assets
'''

[tasks.dev]
description = "Build and run Public and Admin Workers locally"
run = '''
mise run build
mise run wrangler-dev-public &
mise run wrangler-dev-admin &
trap 'trap - INT TERM EXIT; kill -TERM -- -$$ 2>/dev/null || true' INT TERM EXIT
wait
'''

[tasks.e2e-prepare]
description = "Recreate only the isolated local D1 used by E2E tests"
hide = true
run = '''
set -eu
node -e 'const net = require("node:net"); (async () => { for (const port of [8787, 8788]) await new Promise((resolve, reject) => { const server = net.createServer(); server.once("error", () => reject(new Error(`E2E requires port ${port} to be free; stop the existing listener and retry.`))); server.listen(port, "127.0.0.1", () => server.close(resolve)); }); })().catch(error => { console.error(error.message); process.exit(1); });'
rm -rf .wrangler/e2e
mise run d1-local-init
'''

[tasks.e2e-dev]
description = "Prepare isolated local D1 and start the local Workers for Playwright"
hide = true
run = '''
set -eu
export E2E_D1_PERSIST="../.wrangler/e2e"
mise run e2e-prepare
mise run dev
'''
