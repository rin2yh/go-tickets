[tools]
go = "1.27.1"
node = "26.7.0"
pnpm = "11.5.1"
"npm:wrangler" = "4.145.0"

[task_config]
includes = [
  "mise-tasks",
  ".mise-tasks",
  ".mise/tasks",
  ".config/mise/tasks",
  "mise/tasks",
  "backend/tasks.toml",
  "frontend/tasks.toml",
]

[tasks.test]
description = "Run Go and frontend tests"
run = [{ task = "test-go" }, { task = "test-frontend" }]

[tasks.build-public]
description = "Build Public Worker and frontend assets"
run = [
  { task = "generate-public-runtime" },
  { task = "build-public-wasm" },
  { task = "build-frontend" },
]

[tasks.build-admin]
description = "Build the Admin Worker"
run = [{ task = "generate-admin-runtime" }, { task = "build-admin-wasm" }]

[tasks.dev]
description = "Run Public and Admin Workers locally through one Wrangler process"
run = [
  { task = "build-public" },
  { task = "build-admin" },
  { task = "wrangler-dev" },
]

[tasks.wrangler-dev]
run = "wrangler dev -c wrangler.public.jsonc -c wrangler.admin.jsonc --local --port 8787 --persist-to .wrangler/state"

[tasks.dry-public]
description = "Build and validate the Public Worker bundle"
run = [{ task = "build-public" }, { task = "dry-public-bundle" }]

[tasks.dry-admin]
description = "Build and validate the Admin Worker bundle"
run = [{ task = "build-admin" }, { task = "dry-admin-bundle" }]
