[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
node = "26.7.0"
pnpm = "11.5.1"
"npm:wrangler" = "4.145.0"

[task_config]
includes = [
  "backend/tasks.toml",
  "frontend/tasks.toml",
]

[tasks.test]
description = "Run Go tests"
run = [{ task = "test-go" }]

[tasks.build-public]
description = "Build Public Worker and frontend assets"
run = [
  { task = "generate-public-runtime" },
  { task = "build-public-wasm" },
  { task = "build-frontend" },
]

[tasks.build-admin]
description = "Build the Admin Worker"
run = [{ task = "generate-admin-runtime" }, { task = "build-admin-wasm" }]

[tasks.dev]
description = "Run the Public Worker locally"
run = [
  { task = "build-public" },
  { task = "wrangler-dev" },
]

[tasks.dev-admin]
description = "Run the Admin Worker locally"
run = [{ task = "build-admin" }, { task = "wrangler-dev-admin" }]

[tasks.wrangler-dev]
run = "wrangler dev -c wrangler.public.jsonc --local --port 8787 --persist-to .wrangler/state"

[tasks.dry-public]
description = "Build and validate the Public Worker bundle"
run = [{ task = "build-public" }, { task = "dry-public-bundle" }]

[tasks.dry-admin]
description = "Build and validate the Admin Worker bundle"
run = [{ task = "build-admin" }, { task = "dry-admin-bundle" }]
