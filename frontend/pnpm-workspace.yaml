minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

packages:
  - public
  - admin
  - ui
  - e2e

catalog:
  "@praha/byethrow": 0.12.0
  "@clerk/react": 6.17.4
  "@rolldown/plugin-babel": 0.2.4
  "@testing-library/react": ^16.3.3
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  babel-plugin-react-compiler: 1.0.0
  jsdom: ^30.1.1
  react: 19.3.0
  react-dom: 19.3.0
  # Keep TypeScript separate: Astro check does not support TypeScript 7 yet.
  vite: 8.3.3
  vitest: 5.0.3
  "@vitest/coverage-v8": 5.0.3

allowBuilds:
  esbuild: true
  browser-tabs-lock: false
  core-js: false
  sharp: false
  unrs-resolver: true

overrides:
  # Remove after eslint-plugin-boundaries 7.2.1 meets minimumReleaseAge and is adopted.
  handlebars: 4.7.10

# `eslint-plugin-boundaries` consumes only repository-defined patterns; braces has no patched release.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
