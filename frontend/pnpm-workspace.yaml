minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

packages:
  - public
  - admin
  - ui
  - e2e

catalog:
  "@clerk/react": 6.17.4
  "@rolldown/plugin-babel": 0.2.4
  "@testing-library/react": ^16.3.3
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  babel-plugin-react-compiler: 1.0.0
  jsdom: ^30.1.1
  react: 19.3.0
  react-dom: 19.3.0
  # Keep TypeScript separate: Astro check does not support TypeScript 7 yet.
  vite: 8.3.1
  vitest: 5.0.3

allowBuilds:
  esbuild: true
  browser-tabs-lock: false
  core-js: false
  sharp: false
  unrs-resolver: true

minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0

overrides:
  handlebars: 4.7.10
  http-cache-semantics@<=4.2.0: 4.3.0

# `eslint-plugin-boundaries` consumes only repository-defined patterns; braces has no patched release.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
